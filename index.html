<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DER/Smart Grid Case Study Survey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .animate-in {
        animation: fadeIn 0.4s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .tab-active {
        background: white;
        color: #4f46e5;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .tab-inactive {
        color: #94a3b8;
      }
      #loading-screen {
        transition: opacity 0.4s ease;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="p-4 md:p-8">
    <div
      id="loading-screen"
      class="fixed inset-0 flex items-center justify-center bg-slate-50 z-50"
    >
      <div class="flex flex-col items-center gap-4">
        <div
          class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"
        ></div>
        <p class="text-slate-500 font-medium">연결 중...</p>
      </div>
    </div>

    <div
      id="login-screen"
      class="hidden fixed inset-0 flex items-center justify-center bg-slate-100 z-40"
    >
      <div
        class="bg-white rounded-3xl shadow-xl p-10 w-full max-w-sm animate-in text-center"
      >
        <div
          class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center mb-4 text-white mx-auto shadow-lg shadow-indigo-100"
        >
          <i data-lucide="zap" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800">DER Case Study</h1>
        <p class="text-slate-400 text-sm mt-1 mb-8">로그인하여 시작하세요</p>
        <div class="space-y-4">
          <input
            id="login-email"
            type="email"
            placeholder="이메일"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-400 transition-all bg-slate-50 focus:bg-white"
          />
          <input
            id="login-password"
            type="password"
            placeholder="비밀번호"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-indigo-400 transition-all bg-slate-50 focus:bg-white"
          />
          <p id="login-error" class="text-red-500 text-xs hidden">
            아이디 또는 비밀번호가 올바르지 않습니다.
          </p>
          <button
            id="login-btn"
            onclick="handleLogin()"
            class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-lg transition-all mt-2"
          >
            로그인
          </button>
        </div>
      </div>
    </div>

    <div
      id="nickname-popup"
      class="hidden fixed inset-0 flex items-center justify-center bg-black/40 z-50 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-3xl p-8 w-full max-w-sm animate-in text-center"
      >
        <h2 class="text-xl font-black mb-2 text-slate-800">
          👋 처음 오셨군요!
        </h2>
        <p class="text-slate-500 text-sm mb-6">
          사용하실 닉네임을 입력해 주세요.
        </p>
        <input
          id="nickname-input"
          type="text"
          placeholder="닉네임"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 mb-4 outline-none focus:border-indigo-400"
        />
        <button
          onclick="saveNickname()"
          class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-md"
        >
          시작하기
        </button>
      </div>
    </div>

    <div id="app-root" class="hidden max-w-7xl mx-auto">
      <div
        class="flex items-center justify-between mb-6 bg-white rounded-2xl border border-slate-200 px-5 py-3 shadow-sm"
      >
        <div class="flex items-center gap-3">
          <button
            onclick="goHome()"
            class="flex items-center gap-2 text-indigo-600 font-bold text-sm hover:opacity-70 transition-all"
          >
            <i data-lucide="home" class="w-4 h-4"></i> 홈
          </button>
          <span class="text-slate-200">|</span>
          <div class="flex items-center gap-2">
            <span
              id="nav-nickname"
              class="text-sm font-bold text-slate-700"
            ></span>
            <span
              id="nav-admin-badge"
              class="hidden px-2 py-0.5 bg-amber-100 text-amber-700 text-[10px] font-black rounded-full"
              >ADMIN</span
            >
          </div>
        </div>
        <button
          onclick="handleLogout()"
          class="p-2 text-slate-400 hover:text-red-500 transition-colors"
          title="로그아웃"
        >
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>

      <div
        class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 mb-6 w-fit"
      >
        <button
          id="tab-survey"
          onclick="switchTab('survey')"
          class="px-5 py-2 rounded-xl text-sm font-bold transition-all tab-active"
        >
          📝 케이스 작성
        </button>
        <button
          id="tab-history"
          onclick="switchTab('history')"
          class="px-5 py-2 rounded-xl text-sm font-bold transition-all tab-inactive"
        >
          📚 전체 이력
        </button>
      </div>

      <div id="survey-panel" class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1">
          <div
            class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6"
          >
            <div class="flex items-center justify-between mb-6">
              <h2 class="font-bold text-slate-700 text-sm">My Cases</h2>
              <button
                onclick="actions.startNew()"
                class="text-indigo-600 hover:scale-110 transition-transform"
              >
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
              </button>
            </div>
            <div
              id="cases-list"
              class="space-y-3 max-h-[70vh] overflow-y-auto custom-scrollbar"
            ></div>
          </div>
        </aside>

        <main class="lg:col-span-3 space-y-6">
          <div
            class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-6"
          >
            <div class="flex-1">
              <input
                id="case-name-input"
                type="text"
                placeholder="분석할 Deal 명칭을 입력하세요..."
                class="text-2xl font-black text-slate-800 bg-transparent border-none outline-none w-full placeholder:text-slate-200"
              />
            </div>
            <div
              class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-100"
            >
              <button
                id="btn-survey-mode"
                onclick="actions.setMode('survey')"
                class="px-5 py-2 rounded-xl text-sm font-bold transition-all"
              >
                작성 모드
              </button>
              <button
                id="btn-report-mode"
                onclick="actions.setMode('report')"
                class="px-5 py-2 rounded-xl text-sm font-bold transition-all"
              >
                미리보기
              </button>
            </div>
          </div>
          <div id="dynamic-container"></div>
        </main>
      </div>

      <div id="history-panel" class="hidden">
        <div
          class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden animate-in"
        >
          <div
            class="px-8 py-5 border-b border-slate-50 bg-slate-50/30 font-bold text-slate-600 text-sm"
          >
            전체 분석 이력
          </div>
          <div id="history-list" class="divide-y divide-slate-100"></div>
        </div>
      </div>
    </div>

    <div
      id="toast"
      class="fixed bottom-8 right-8 z-[100] opacity-0 translate-y-4 pointer-events-none transition-all duration-300 bg-slate-800 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3"
    >
      <i
        data-lucide="check-circle"
        class="w-5 h-5 text-emerald-400 shrink-0"
      ></i>
      <span id="toast-message" class="font-medium text-sm"></span>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        getDoc,
        addDoc,
        updateDoc,
        deleteDoc,
        onSnapshot,
        query,
        orderBy,
      } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyC934dCgdBbOZ0QbU4a_xoRlVs8fXAQD4E',
        authDomain: 'project-ge-case-study.firebaseapp.com',
        projectId: 'project-ge-case-study',
        storageBucket: 'project-ge-case-study.firebasestorage.app',
        messagingSenderId: '673293859398',
        appId: '1:673293859398:web:7be29cdd6afd3d51f96847',
      };

      const QUESTIONS = [
        {
          id: 'buyer_info',
          section: '1. Deal 배경',
          label: '1.1 매수자 개요',
          description:
            '회사명, 국가, Business Model, 자산규모, 매출규모를 입력해주세요.',
          placeholder: '예: 솔라엣지 / 이스라엘 / 태양광 인버터 및 모니터링...',
        },
        {
          id: 'target_info',
          section: '1. Deal 배경',
          label: '1.2 인수대상기업 개요',
          description:
            '회사명, 국가, Business Model, 자산규모, 매출규모 (인수 직전)를 입력해주세요.',
          placeholder: '예: 위브(Weave) / 미국 / DER 제어 플랫폼...',
        },
        {
          id: 'deal_overview',
          section: '1. Deal 배경',
          label: '1.3 Deal 개요',
          description: '거래금액 및 거래방식을 입력해주세요.',
          placeholder: '예: $150M 현금 인수...',
        },
        {
          id: 'strategic_motivation',
          section: '2. Strategic Rationale',
          label: '2.1 동기분석',
          description:
            '시장 점유율 확대인가, 신기술 확보인가, 혹은 수직적 통합인가?',
          placeholder: '전략적 의도...',
        },
        {
          id: 'synergy_expectation',
          section: '2. Strategic Rationale',
          label: '2.2 Synergy 기대',
          description: '기대한 구체적인 시너지는 무엇이었나요?',
          placeholder: '기술 결합 효과 등...',
        },
        {
          id: 'build_vs_buy',
          section: '2. Strategic Rationale',
          label: '2.3 대체재 검토',
          description: 'Build 대신 Buy를 선택한 이유는?',
          placeholder: '시장 진입 속도 등...',
        },
        {
          id: 'valuation_check',
          section: '3. Valuation & Process',
          label: '3.1 Valuation 적정성',
          description: '인수가는 적정했나요? Multiple 확인.',
          placeholder: 'Valuation 분석...',
        },
        {
          id: 'competitive_landscape',
          section: '3. Valuation & Process',
          label: '3.2 경쟁 구도',
          description: '경쟁 입찰자 및 승자의 저주 여부.',
          placeholder: '경쟁 구도...',
        },
        {
          id: 'pmi_process',
          section: '4. PMI & Outcomes',
          label: '4.1 PMI',
          description: '조직/시스템 통합은 매끄러웠나요?',
          placeholder: 'PMI 과정...',
        },
        {
          id: 'financial_results',
          section: '4. PMI & Outcomes',
          label: '4.2 재무적 결과',
          description: '인수 후 수익성이 실제로 개선되었나요?',
          placeholder: '재무 성과...',
        },
        {
          id: 'market_reaction',
          section: '4. PMI & Outcomes',
          label: '4.3 시장 반응',
          description: '발표 직후와 1년 후 시장의 평가는?',
          placeholder: '주가 및 평가...',
        },
      ];

      const state = {
        user: null,
        userProfile: null,
        currentStep: 0,
        responses: {},
        caseName: '',
        isViewingReport: false,
        savedCases: [],
        activeCaseId: null,
        currentTab: 'survey',
      };

      const firebaseApp = initializeApp(firebaseConfig);
      const auth = getAuth(firebaseApp);
      const db = getFirestore(firebaseApp);

      function triggerToast(msg, isError = false) {
        const t = document.getElementById('toast');
        document.getElementById('toast-message').textContent = msg;
        t.classList.toggle('bg-red-600', isError);
        t.classList.remove('opacity-0', 'translate-y-4');
        t.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
          t.classList.add('opacity-0', 'translate-y-4');
          t.classList.remove('opacity-100', 'translate-y-0');
        }, 3000);
      }

      function showScreen(screenId) {
        const loadingEl = document.getElementById('loading-screen');
        if (screenId !== 'loading-screen' && loadingEl) {
          loadingEl.classList.add('fade-out');
          setTimeout(() => loadingEl.classList.add('hidden'), 400);
        }
        ['login-screen', 'app-root'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.classList.toggle('hidden', id !== screenId);
        });
        setTimeout(() => lucide.createIcons(), 100);
      }

      function escHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      window.handleLogin = async () => {
        const email = document.getElementById('login-email').value.trim();
        const pw = document.getElementById('login-password').value;
        if (!email || !pw) return;
        try {
          await signInWithEmailAndPassword(auth, email, pw);
        } catch (e) {
          document.getElementById('login-error').classList.remove('hidden');
        }
      };

      window.handleLogout = async () => {
        await signOut(auth);
      };

      async function loadUserProfile(uid) {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          state.userProfile = snap.data();
          return true;
        }
        return false;
      }

      window.saveNickname = async () => {
        const val = document.getElementById('nickname-input').value.trim();
        if (!val) return;
        const isAdmin = auth.currentUser.email === 'admin@bsco.co.kr';
        await setDoc(
          doc(db, 'users', state.user.uid),
          { nickname: val, isAdmin: isAdmin },
          { merge: true }
        );
        state.userProfile = { nickname: val, isAdmin: isAdmin };
        document.getElementById('nickname-popup').classList.add('hidden');
        updateNavBar();
      };

      function updateNavBar() {
        document.getElementById('nav-nickname').textContent =
          state.userProfile?.nickname || '';
        document
          .getElementById('nav-admin-badge')
          .classList.toggle('hidden', !state.userProfile?.isAdmin);
      }

      function subscribeCases() {
        const q = query(collection(db, 'cases'), orderBy('updatedAt', 'desc'));
        onSnapshot(q, (snap) => {
          state.savedCases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderCasesList();
          if (state.currentTab === 'history') renderHistory();
        });
      }

      window.switchTab = (tab) => {
        state.currentTab = tab;
        document
          .getElementById('survey-panel')
          .classList.toggle('hidden', tab !== 'survey');
        document
          .getElementById('history-panel')
          .classList.toggle('hidden', tab !== 'history');
        document.getElementById(
          'tab-survey'
        ).className = `px-5 py-2 rounded-xl text-sm font-bold transition-all ${
          tab === 'survey' ? 'tab-active' : 'tab-inactive'
        }`;
        document.getElementById(
          'tab-history'
        ).className = `px-5 py-2 rounded-xl text-sm font-bold transition-all ${
          tab === 'history' ? 'tab-active' : 'tab-inactive'
        }`;
        if (tab === 'history') renderHistory();
        lucide.createIcons();
      };

      window.goHome = () => {
        actions.startNew();
        switchTab('survey');
      };

      window.actions = {
        setMode(mode) {
          state.isViewingReport = mode === 'report';
          renderSurveyArea();
          updateModeButtons();
        },
        startNew() {
          state.activeCaseId = null;
          state.caseName = '';
          state.responses = {};
          state.currentStep = 0;
          state.isViewingReport = false;
          document.getElementById('case-name-input').value = '';
          renderSurveyArea();
          updateModeButtons();
        },
        async save(isSilent = false) {
          if (!state.caseName.trim()) {
            if (!isSilent) triggerToast('제목을 입력해주세요.', true);
            return;
          }
          const data = {
            name: state.caseName.trim(),
            responses: state.responses,
            updatedAt: new Date().toISOString(),
            nickname: state.userProfile.nickname,
          };
          try {
            if (state.activeCaseId) {
              await updateDoc(doc(db, 'cases', state.activeCaseId), data);
              if (!isSilent) triggerToast('저장되었습니다.');
            } else {
              const docRef = await addDoc(collection(db, 'cases'), {
                ...data,
                createdBy: state.user.uid,
                createdAt: new Date().toISOString(),
              });
              state.activeCaseId = docRef.id;
              if (!isSilent) triggerToast('신규 저장되었습니다.');
            }
          } catch (e) {
            console.error(e);
          }
        },
        async deleteCase(id) {
          const target = state.savedCases.find((c) => c.id === id);
          if (!state.userProfile.isAdmin && target.createdBy !== state.user.uid)
            return triggerToast('권한 부족');
          if (confirm('삭제할까요?')) {
            await deleteDoc(doc(db, 'cases', id));
            if (state.activeCaseId === id) this.startNew();
          }
        },
        async nextStep() {
          if (state.caseName.trim()) this.save(true);
          if (state.currentStep < QUESTIONS.length - 1) {
            state.currentStep++;
            renderSurveyArea();
          } else {
            this.setMode('report');
          }
        },
        loadCase(id) {
          const c = state.savedCases.find((x) => x.id === id);
          state.activeCaseId = id;
          state.caseName = c.name;
          state.responses = c.responses || {};
          state.currentStep = 0;
          document.getElementById('case-name-input').value = c.name;
          this.setMode('report');
          switchTab('survey');
        },
      };

      function renderCasesList() {
        const listEl = document.getElementById('cases-list');
        const myCases = state.savedCases.filter(
          (c) => c.createdBy === state.user.uid
        );
        listEl.innerHTML = myCases
          .map(
            (c) => `
        <div class="relative group">
            <button onclick="actions.loadCase('${
              c.id
            }')" class="w-full text-left p-4 rounded-2xl border ${
              state.activeCaseId === c.id
                ? 'border-indigo-500 bg-indigo-50'
                : 'border-slate-100 hover:bg-slate-50'
            }">
                <p class="text-sm font-bold truncate pr-6">${escHtml(
                  c.name
                )}</p>
                <p class="text-[10px] text-slate-400 mt-1">${new Date(
                  c.updatedAt
                ).toLocaleDateString()}</p>
            </button>
            <button onclick="event.stopPropagation(); actions.deleteCase('${
              c.id
            }')" class="absolute top-4 right-3 opacity-0 group-hover:opacity-100 text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`
          )
          .join('');
        lucide.createIcons();
      }

      function renderSurveyArea() {
        const container = document.getElementById('dynamic-container');
        const activeCase = state.savedCases.find(
          (c) => c.id === state.activeCaseId
        );
        const canEdit =
          !state.activeCaseId ||
          state.userProfile.isAdmin ||
          activeCase?.createdBy === state.user.uid;

        if (!state.isViewingReport) {
          const q = QUESTIONS[state.currentStep];
          container.innerHTML = `
        <div class="bg-white rounded-3xl p-8 border border-slate-200 animate-in">
            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 inline-block">${
              q.section
            }</span>
            <h3 class="text-xl font-bold mb-1 text-slate-800">${q.label}</h3>
            <p class="text-slate-500 text-sm mb-6">${q.description}</p>
            <textarea id="res-area" ${
              !canEdit ? 'disabled' : ''
            } class="w-full h-64 p-6 bg-slate-50 rounded-2xl border-2 border-slate-100 focus:bg-white outline-none text-lg leading-relaxed resize-none transition-all placeholder:text-slate-300" placeholder="${
            q.placeholder
          }">${state.responses[q.id] || ''}</textarea>
            <div class="flex justify-between mt-8">
                <button onclick="state.currentStep--; renderSurveyArea()" class="text-slate-400 font-bold" ${
                  state.currentStep === 0 ? 'disabled' : ''
                }>이전</button>
                <div class="flex gap-2">
                    ${
                      canEdit
                        ? `<button onclick="actions.save()" class="px-6 py-3 border border-slate-200 rounded-xl font-bold text-slate-600">저장</button>`
                        : ''
                    }
                    <button onclick="actions.nextStep()" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold">다음</button>
                </div>
            </div>
        </div>`;
          document.getElementById('res-area').addEventListener('input', (e) => {
            state.responses[q.id] = e.target.value;
          });
        } else {
          container.innerHTML = `
        <div class="bg-white rounded-3xl p-8 border border-slate-200 animate-in">
            <div class="flex flex-wrap justify-between items-center mb-8 border-b pb-6 gap-4">
                <h2 class="text-2xl font-black">Case Study Report</h2>
                <div class="flex gap-2">
                    ${
                      canEdit
                        ? `
                        <button onclick="actions.setMode('survey')" class="px-4 py-2 border border-slate-200 rounded-xl font-bold text-sm text-slate-600">수정하기</button>
                        <button onclick="actions.save()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold text-sm">최종 저장</button>
                        <button onclick="actions.deleteCase('${state.activeCaseId}')" class="px-3 py-2 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    `
                        : ''
                    }
                </div>
            </div>
            <div class="space-y-10">
                ${QUESTIONS.map(
                  (q) =>
                    `<div><p class="text-xs font-black text-indigo-600 uppercase mb-3">■ ${
                      q.label
                    }</p><div class="text-slate-800 bg-slate-50 p-7 rounded-2xl whitespace-pre-wrap leading-relaxed border border-slate-100 text-lg shadow-inner">${
                      state.responses[q.id]
                        ? escHtml(state.responses[q.id])
                        : '<span class="text-slate-300 italic">미입력 정보</span>'
                    }</div></div>`
                ).join('')}
            </div>
        </div>`;
        }
        lucide.createIcons();
      }

      function updateModeButtons() {
        const btnR = document.getElementById('btn-report-mode');
        const btnS = document.getElementById('btn-survey-mode');
        btnR.textContent = state.isViewingReport ? '리포트 결과' : '미리보기';
        btnS.className = `px-5 py-2 rounded-xl text-sm font-bold transition-all ${
          !state.isViewingReport ? 'tab-active' : 'text-slate-400'
        }`;
        btnR.className = `px-5 py-2 rounded-xl text-sm font-bold transition-all ${
          state.isViewingReport ? 'tab-active' : 'text-slate-400'
        }`;
      }

      function renderHistory() {
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = state.savedCases
          .map(
            (c) => `
        <div class="px-8 py-6 hover:bg-slate-50 transition-colors flex items-center justify-between">
            <div>
                <h3 class="text-lg font-black text-slate-800">${escHtml(
                  c.name
                )}</h3>
                <p class="text-xs text-slate-400 mt-1">작성자: ${
                  c.nickname
                } | 일시: ${new Date(c.updatedAt).toLocaleString()}</p>
            </div>
            <button onclick="actions.loadCase('${
              c.id
            }')" class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-bold hover:bg-indigo-100">열기</button>
        </div>`
          )
          .join('');
      }

      onAuthStateChanged(auth, async (user) => {
        state.authResolved = true;
        if (user) {
          state.user = user;
          const exists = await loadUserProfile(user.uid);
          if (user.email === 'admin@bsco.co.kr') {
            if (!state.userProfile) state.userProfile = {};
            state.userProfile.isAdmin = true;
          }
          subscribeCases();
          showScreen('app-root');
          updateNavBar();
          if (!exists)
            document
              .getElementById('nickname-popup')
              .classList.remove('hidden');
          renderSurveyArea();
          updateModeButtons();
        } else {
          showScreen('login-screen');
        }
      });

      const handleEnter = (e) => {
        if (e.key === 'Enter') window.handleLogin();
      };
      document
        .getElementById('login-email')
        .addEventListener('keydown', handleEnter);
      document
        .getElementById('login-password')
        .addEventListener('keydown', handleEnter);
      document
        .getElementById('case-name-input')
        .addEventListener('input', (e) => {
          state.caseName = e.target.value;
        });

      lucide.createIcons();
    </script>
  </body>
</html>
